syntax = "proto3";

package Proto.Auth;

message Certificate
{
	bytes privatekey = 1;
	bytes token = 2;
	bytes ctoken = 3;
}

message Connect
{
	bytes signature = 1;
	bytes publickey = 2;
	bytes token = 3;
	bytes infostring = 4;

	string connect_ticket = 5;
	string match_id = 6;
	string session_id = 7;
}

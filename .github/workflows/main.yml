name: Build zw3.dll

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build zw3 solution
    runs-on: windows-2022
    strategy:
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Check out files
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          lfs: false

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Generate project files
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/prepare-x64.ps1

      - name: Set up problem matching
        uses: ammaraskar/msvc-problem-matcher@master

      - name: Build zw3 solution - ${{ matrix.configuration }}
        run: |
            msbuild build/zw3.sln `
            /m `
            /v:minimal `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=x64 `
            /p:TreatWarningsAsErrors=false `
            /p:WarningsAsErrors= `
            /p:AdditionalOptions="/WX-"  # <- disables warning as error at cl.exe level

      - name: Upload zw3.dll + pdb (${{ matrix.configuration }})
        uses: actions/upload-artifact@v4
        with:
          name: zw3-${{ matrix.configuration }}
          path: |
            build/bin/x64/${{ matrix.configuration }}/zw3.dll
            build/bin/x64/${{ matrix.configuration }}/d3d9.dll
            build/bin/x64/${{ matrix.configuration }}/zw3.pdb
